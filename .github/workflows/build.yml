name: Android Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.caching=true
  NDK_VERSION: 29.0.14206865
  CMAKE_VERSION: 4.4.2

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;${NDK_VERSION}"

      - name: Verify Android SDK
        shell: bash
        run: |
          java -version
          sdkmanager --version
          sdkmanager --list_installed

          test -d "$ANDROID_HOME/platforms/android-36"
          test -d "$ANDROID_HOME/build-tools/36.0.0"
          test -d "$ANDROID_HOME/ndk/${NDK_VERSION}"

      - name: Setup CMake 4.4.2
        shell: bash
        run: |
          CMAKE_DIR="$RUNNER_TEMP/cmake-${CMAKE_VERSION}"

          curl -L \
            --fail \
            --retry 5 \
            --retry-delay 2 \
            -o "$RUNNER_TEMP/cmake.tar.gz" \
            "https://github.com/Kitware/CMake/releases/download/v${CMAKE_VERSION}/cmake-${CMAKE_VERSION}-linux-x86_64.tar.gz"

          mkdir -p "$CMAKE_DIR"

          tar -xzf \
            "$RUNNER_TEMP/cmake.tar.gz" \
            --strip-components=1 \
            -C "$CMAKE_DIR"

          echo "$CMAKE_DIR/bin" >> "$GITHUB_PATH"

          "$CMAKE_DIR/bin/cmake" --version

      - name: Verify project
        shell: bash
        run: |
          test -f build.gradle.kts
          test -f settings.gradle.kts
          test -f Tank/build.gradle.kts
          test -f gradlew

      - name: Generate Gradle Wrapper
        shell: bash
        run: |
          gradle wrapper \
            --gradle-version 9.5 \
            --distribution-type bin

      - name: Make Gradle Wrapper executable
        shell: bash
        run: |
          chmod +x gradlew

      - name: Build Debug APK
        shell: bash
        run: |
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Omni_Tank-debug
          path: Tank/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14