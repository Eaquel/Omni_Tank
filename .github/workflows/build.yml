name: Omni Tank Android

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: omni-tank-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Android Build
    runs-on: ubuntu-24.04

    env:
      GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.caching=true
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      NDK_VERSION: 29.0.14206865
      CMAKE_VERSION: 4.4.2

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4.0.1

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true

      - name: Install Android SDK
        shell: bash
        run: |
          sdkmanager --install "platform-tools"
          sdkmanager --install "platforms;android-37"
          sdkmanager --install "build-tools;37.0.0"
          sdkmanager --install "ndk;${NDK_VERSION}"

      - name: Install CMake 4.4.2
        shell: bash
        run: |
          set -euo pipefail

          CMAKE_ROOT="${RUNNER_TEMP}/cmake-${CMAKE_VERSION}"
          CMAKE_ARCHIVE="${RUNNER_TEMP}/cmake-${CMAKE_VERSION}.tar.gz"

          rm -rf "${CMAKE_ROOT}"
          rm -f "${CMAKE_ARCHIVE}"

          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-delay 2 \
            --retry-all-errors \
            "https://cmake.org/files/v4.4/cmake-${CMAKE_VERSION}-linux-x86_64.tar.gz" \
            --output "${CMAKE_ARCHIVE}"

          mkdir -p "${CMAKE_ROOT}"

          tar \
            --extract \
            --gzip \
            --file "${CMAKE_ARCHIVE}" \
            --directory "${CMAKE_ROOT}" \
            --strip-components=1

          test -x "${CMAKE_ROOT}/bin/cmake"

          echo "${CMAKE_ROOT}/bin" >> "${GITHUB_PATH}"

      - name: Verify Java
        shell: bash
        run: |
          java -version
          javac -version

      - name: Verify CMake
        shell: bash
        run: |
          cmake --version
          test "$(cmake --version | head -n 1)" = "cmake version ${CMAKE_VERSION}"

      - name: Verify Android SDK
        shell: bash
        run: |
          test -d "${ANDROID_SDK_ROOT}/platforms/android-37"
          test -d "${ANDROID_SDK_ROOT}/build-tools/37.0.0"
          test -d "${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}"

      - name: Verify Gradle
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew --version

      - name: Build Debug APK
        shell: bash
        run: |
          ./gradlew clean assembleDebug \
            --stacktrace \
            --warning-mode all

      - name: Upload Debug APK
        uses: actions/upload-artifact@v5
        with:
          name: Omni-Tank-debug
          path: Tank/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14