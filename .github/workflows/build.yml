name: Omni Tank Android

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android
    runs-on: ubuntu-24.04

    env:
      GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.caching=true

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4.0.1

      - name: Refresh SDK repositories
        run: |
          sdkmanager --update

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-37"
          sdkmanager "build-tools;37.0.0"
          sdkmanager "cmake;4.4.3"

      - name: Accept Android SDK licenses
        run: |
          yes | sdkmanager --licenses >/dev/null || true

      - name: Verify Android SDK
        run: |
          sdkmanager --list_installed
          test -d "$ANDROID_SDK_ROOT/platforms/android-37"
          test -d "$ANDROID_SDK_ROOT/cmake/4.4.3"

      - name: Verify CMake
        run: |
          "$ANDROID_SDK_ROOT/cmake/4.4.3/bin/cmake" --version

      - name: Verify Java
        run: |
          java -version
          javac -version

      - name: Grant Gradle permission
        run: chmod +x ./gradlew

      - name: Verify Gradle
        run: ./gradlew --version

      - name: Build Debug APK
        run: ./gradlew clean assembleDebug --stacktrace --warning-mode all

      - name: Upload Debug APK
        uses: actions/upload-artifact@v5
        with:
          name: Omni-Tank-debug
          path: Tank/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14